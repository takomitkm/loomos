[workspace]
resolver = "2"
members = [
    "crates/normos-runtime",
    "crates/normos-inference",
    "crates/normos-device",
    "crates/normos-audio",
    "crates/normos-nlu",
    "crates/normos-home",
    "crates/normos-executor",
    "crates/normos-vision",
    "crates/normosd",
    "crates/normos-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/takomitkm/loomos"
description = "normos — HA4FPAI (板上语音控制栈) 的可组合、高保证 Rust 重构原型"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
toml = "0.8"

normos-runtime = { path = "crates/normos-runtime" }
normos-inference = { path = "crates/normos-inference" }
normos-device = { path = "crates/normos-device" }
normos-audio = { path = "crates/normos-audio" }
normos-nlu = { path = "crates/normos-nlu" }
normos-home = { path = "crates/normos-home" }
normos-vision = { path = "crates/normos-vision" }
normos-executor = { path = "crates/normos-executor" }


[profile.release]
debug = true
