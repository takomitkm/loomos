[workspace]
resolver = "2"
members = [
    "crates/loomos-runtime",
    "crates/loomos-sys",
    "crates/loomos-ort-sys",
    "crates/loomos-inference",
    "crates/loomos-device",
    "crates/loomos-audio",
    "crates/loomos-adapters-sherpa",
    "crates/loomos-nlu",
    "crates/loomos-home",
    "crates/loomos-executor",
    "crates/loomos-vision",
    "crates/loomos-wamr-sys",
    "crates/loomos-wamr",
    "crates/loomos-ab",
    "crates/loomosd",
    "crates/loomos-cli",
    "crates/loomos-nlu-wasm-wrap",
    "crates/loomos-nlu-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/takomitkm/loomos"
description = "loomos — HA4FPAI (板上语音控制栈) 的可组合、高保证 Rust 重构原型"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
toml = "0.8"

loomos-runtime = { path = "crates/loomos-runtime" }
loomos-sys = { path = "crates/loomos-sys" }
loomos-ort-sys = { path = "crates/loomos-ort-sys" }
loomos-inference = { path = "crates/loomos-inference" }
loomos-device = { path = "crates/loomos-device" }
loomos-audio = { path = "crates/loomos-audio" }
loomos-adapters-sherpa = { path = "crates/loomos-adapters-sherpa" }
loomos-nlu = { path = "crates/loomos-nlu" }
loomos-home = { path = "crates/loomos-home" }
loomos-vision = { path = "crates/loomos-vision" }
loomos-wamr = { path = "crates/loomos-wamr" }
loomos-wamr-sys = { path = "crates/loomos-wamr-sys" }
loomos-ab = { path = "crates/loomos-ab" }
loomos-executor = { path = "crates/loomos-executor" }


[profile.release]
debug = true
