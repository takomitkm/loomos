# platform.yml — Nix/Wasm/WAMR 平台化 CI（ADR-011 v1.1 / ADR-012，architecture/02 §2.5 N0–N4）
#
# 职责：
# - nix job：钉死 flake 评估 + 四包构建（N0 验收）
# - wamr-matrix job：Linux/Windows/macOS 三平台真链接 libiwasm + 真加载 NLU 组件
#   + Host ABI 通道 E2E（N1/N2/N4 验证；奇偶校验和跨平台比对）
# - parity job：聚合三平台 checksum 工件，验证同一 wasm 组件行为一致（N4 验收）
# - wasm-aot job：wamrc 产出 aarch64 AOT + 魔数/版本校验
#
# 板测不在 CI（高风险 L2/L3 不进无人值守——AGENTS.md）。

name: platform

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  WAMR_REV: 06f6c8c6e64e75eee6b8a3ce06ac2c7d10d015bf

jobs:
  nix:
    name: nix-flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-26.05
      - name: flake lock（首跑生成后入库）
        run: |
          test -f flake.lock || { nix flake lock && echo "::notice::flake.lock 已生成——请提交入库"; }
      - name: 上传 flake.lock（供入库）
        uses: actions/upload-artifact@v4
        with:
          name: flake-lock
          path: flake.lock
      - name: nix flake check（-L 全量构建日志）
        run: nix flake check -L --keep-going
      - name: nix build 四包
        run: |
          nix build -L .#loomos-wamr
          nix build -L .#loomos-wamrc
          nix build -L .#loomos-components
          nix build -L .#loomos-host   # 含 workspace cargo test（Linux 侧验收门）

  wamr-matrix:
    # 三平台：真构建 libiwasm → wamr-link 档全测 → E2E 真加载 NLU 组件 → checksum 上传
    name: wamr-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
      - name: rustup target add wasm32-wasip1
        run: rustup target add wasm32-wasip1
      - name: 构建 NLU wasm 组件（canonical .wasm——三平台同一产物）
        run: cargo build --release -p loomos-nlu-wasm-wrap --target wasm32-wasip1
      - name: 构建 WAMR（钉死 rev，最小 feature 集，平台各自产物）
        shell: bash
        run: |
          git clone --depth 1 https://github.com/bytecodealliance/wasm-micro-runtime.git wamr-src
          cd wamr-src && git checkout "$WAMR_REV"
          case "${{ matrix.os }}" in
            ubuntu-latest) PLAT=linux ;;
            windows-latest) PLAT=windows ;;
            macos-latest) PLAT=darwin ;;
          esac
          cmake -S "product-mini/platforms/$PLAT" -B build \
            -DWAMR_BUILD_AOT=1 -DWAMR_BUILD_INTERP=1 \
            -DWAMR_BUILD_FAST_JIT=0 -DWAMR_BUILD_LLVM_JIT=0 \
            -DWAMR_BUILD_WASI=1 -DWAMR_BUILD_LIBC_WASI=1 \
            -DWAMR_BUILD_LIB_PTHREAD=0 -DWAMR_BUILD_SIMD=0 \
            -DWAMR_BUILD_MULTI_MODULE=0
          cmake --build build --config Release
      - name: 定位 libiwasm 静态库
        id: lib
        shell: bash
        run: |
          LIB=$(find wamr-src/build -name 'libiwasm.a' -o -name 'iwasm.lib' | head -1)
          test -n "$LIB" || { echo "未找到 libiwasm"; exit 1; }
          echo "dir=$(dirname "$LIB")" >> "$GITHUB_OUTPUT"
      - name: wamr-link 档全测 + E2E（真加载/Host ABI 奇偶）
        shell: bash
        env:
          IWASM_LIB_DIR: ${{ steps.lib.outputs.dir }}
          LOOMOS_E2E_WASM: ${{ github.workspace }}/target/wasm32-wasip1/release/loomos_nlu_wasm_wrap.wasm
        run: cargo test -p loomos-wamr -p loomos-wamr-sys --features loomos-wamr/wamr-link
      - name: 提取奇偶校验和
        shell: bash
        run: |
          cargo test -p loomos-wamr --features loomos-wamr/wamr-link --test e2e_nlu -- --nocapture \
            | grep "E2E PARITY CHECKSUM" | tee parity-${{ matrix.os }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: parity-${{ matrix.os }}
          path: parity-${{ matrix.os }}.txt

  parity:
    # N4 验收：同一 canonical .wasm 在三平台输出校验和一致
    name: cross-platform-parity
    needs: wamr-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: 三平台校验和比对
        shell: bash
        run: |
          set -e
          U=$(grep -o '[0-9a-f]\{16\}' parity-ubuntu-latest/parity-ubuntu-latest.txt)
          W=$(grep -o '[0-9a-f]\{16\}' parity-windows-latest/parity-windows-latest.txt)
          M=$(grep -o '[0-9a-f]\{16\}' parity-macos-latest/parity-macos-latest.txt)
          echo "ubuntu=$U windows=$W macos=$M"
          test "$U" = "$W" && test "$U" = "$M" \
            || { echo "奇偶校验失败：跨平台输出不一致"; exit 1; }
          echo "OK: 同一 .wasm 组件三平台输出逐字节一致"

  wasm-aot:
    # N3/N4：wamrc 产出 aarch64 AOT + 魔数/版本头校验
    name: wasm-components-and-aot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
      - name: rustup target add wasm32-wasip1
        run: rustup target add wasm32-wasip1
      - name: 构建 wasm 组件
        run: cargo build --release -p loomos-nlu-wasm-wrap --target wasm32-wasip1
      - name: 构建 wamrc
        run: |
          sudo apt-get update && sudo apt-get install -y llvm-18-dev libclang-18-dev clang-18
          git clone --depth 1 https://github.com/bytecodealliance/wasm-micro-runtime.git wamr-src
          cd wamr-src && git checkout "$WAMR_REV"
          cmake -S tools/wamrc -B wamrc-build -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          cmake --build wamrc-build -j
      - name: wamrc → aarch64 AOT + 魔数校验
        run: |
          WASM=target/wasm32-wasip1/release/*.wasm
          wamr-src/wamrc-build/wamrc --target=aarch64 -o /tmp/nlu.aot $WASM
          python3 -c "
          import struct
          b = open('/tmp/nlu.aot','rb').read(8)
          assert b[:4] == b'\x00\x61\x6f\x74', f'AOT magic mismatch: {b[:4].hex()}'
          v = struct.unpack('<I', b[4:8])[0]
          print(f'AOT version={v}')
          assert v == 6, f'AOT version {v} != 6'
          "
