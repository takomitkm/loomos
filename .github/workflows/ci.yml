name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    # Host CI（architecture/08 §8.5）：fmt / clippy / test
    # timeout 兜底：fresh runner 全量编译 18 crates+测试二进制偏长，
    # 超时直接失败给出诊断（默认 3600min 无法暴露卡死）
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # rust-toolchain.toml 裸 channel 无组件——显式补（dtolnay targets 输入已知会静默失效）
      - name: rustup component add（显式钉死 1.99.1）
        run: rustup component add --toolchain 1.99.1 rustfmt clippy
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy（0 warning 门禁）
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: 一键原型验收
        run: bash agent/run-prototype.sh

  cross:
    # Cross CI：aarch64 check（无需 linker；构建与板测按依赖准入另行执行）
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: rustup target add（显式——targets 输入静默失效教训）
        run: rustup target add aarch64-unknown-linux-gnu
      - name: aarch64 cargo check
        run: cargo check --workspace --all-targets --target aarch64-unknown-linux-gnu
      - name: aarch64 loomos-sys linux-backend check
        run: cargo check -p loomos-sys --target aarch64-unknown-linux-gnu --features linux-backend
      - name: Linux Backend 探针测试（ubuntu；只断言档位形状，不断言 enforced——无 CAP_SYS_NICE）
        run: cargo test -p loomos-runtime -p loomos-sys --features linux-backend

  fmt:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt
      - name: rustup component add（钉死工具链上的组件——rust-toolchain.toml 裸 channel 无组件，CI 实证）
        run: rustup component add --toolchain 1.99.1 rustfmt
      - run: cargo fmt --all --check
